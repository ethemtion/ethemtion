name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the main branch
  push:
    branches:
    - main
    
  

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # needed for .github/scripts/snake_finale.py
      - uses: actions/checkout@v5

      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      # pinned: snake_finale.py reads this exact output format (if it ever can't, it leaves the files untouched)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # sorts the eaten-cells bar by color and, once everything is eaten,
      # makes the snake write ETHEMTION (or ETO) with the cells it collected
      - name: sort the bar and write the name
        run: python3 .github/scripts/snake_finale.py dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
        continue-on-error: true # never block deploying the plain snake
        timeout-minutes: 3


      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
